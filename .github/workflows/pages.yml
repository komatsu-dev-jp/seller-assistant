name: Validation Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build the shared approved-screen review app
        env:
          REVIEW_BASE_PATH: /seller-assistant
        run: npm run build --workspace @resale/review
      - name: Record the reviewed commit
        run: printf '%s\n' "${{ github.sha }}" > apps/review/out/commit.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/review/out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
