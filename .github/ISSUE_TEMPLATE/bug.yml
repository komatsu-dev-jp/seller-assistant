name: 不具合・安全停止
description: 再現できる不具合、想定外の挙動、または安全上の停止を報告します。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        住所、認証情報、原価、売上、実データ、生ログは記入しないでください。
        個人情報・権限・在庫・会計・承認状態に関係する問題は、修正を急がず最初にProjectをBlockedへ移し、Solへ判断を戻します。
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影響範囲
      description: 誰に、どのデータ・操作・業務に影響するかを書きます。実データは書きません。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 再現手順
      description: 架空データだけで再現できる手順、環境、頻度を書きます。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 確認材料
      description: テスト名、マスク済みスクリーンショット、関連コミット、仕様へのリンクを書きます。
  - type: dropdown
    id: initial_risk
    attributes:
      label: 初期リスク
      description: 不明なら未判定を選びます。最終判定はSolが行います。
      options:
        - 未判定
        - Low
        - Medium
        - Critical
    validations:
      required: true
  - type: textarea
    id: memory_candidate
    attributes:
      label: 学び・失敗ログ候補
      description: 重大または再発し得る失敗なら、memory/incidents の候補記録へのパスまたは作成予定を書きます。軽微な一過性の失敗は「不要」で構いません。
      placeholder: memory/incidents/INC-YYYYMMDD-NNN-...md
  - type: checkboxes
    id: safety
    attributes:
      label: 安全確認
      options:
        - label: 秘密情報、個人情報、実データ、生ログをこのIssueに含めていません。
          required: true
        - label: 原因不明または仕様矛盾の場合は、推測で修正を進めずBlockedとしてSolの判断を待ちます。
          required: true
