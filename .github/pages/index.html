<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#13213a" />
    <meta name="description" content="フリマ物販業務アプリの承認済みUIを確認する、架空データのみの公開レビュー用PWA" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Resale Ops" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./approved-ui.css" />
    <title>Resale Ops — 承認済みUIレビュー</title>
  </head>
  <body data-mode="mobile">
    <div class="review-app">
      <section class="review-toolbar" id="review-toolbar" aria-label="レビュー設定">
        <div class="toolbar-brand">
          <span class="toolbar-logo" aria-hidden="true">R</span>
          <span>
            <strong>承認済みUIレビュー</strong>
            <small>架空データのみ・保存なし</small>
          </span>
        </div>
        <div class="toolbar-controls">
          <div class="control-group" role="group" aria-label="表示モード">
            <span class="control-label">表示</span>
            <button class="mode-button" type="button" data-mode-button="mobile">スマホ版 <b>75</b></button>
            <button class="mode-button" type="button" data-mode-button="pc">PC版 <b>52</b></button>
          </div>
          <label class="screen-picker">
            <span class="control-label">画面を選ぶ</span>
            <select id="screen-select" aria-label="確認する画面"></select>
          </label>
          <button class="toolbar-button" id="preview-only" type="button">プレビューのみ</button>
        </div>
      </section>

      <button class="review-reopen" id="review-reopen" type="button" hidden>レビュー設定</button>

      <main class="preview-area" id="preview-area">
        <div class="preview-notice">
          <div class="notice-lock" aria-hidden="true">✓</div>
          <div>
            <strong>Slackで承認した画面の確認用ページ</strong>
            <p>ここに表示する数値・写真・人物名はすべて架空です。入力、ログイン、API、データベース、外部サービス連携、公開操作はありません。</p>
          </div>
          <span class="notice-tag">REVIEW ONLY</span>
        </div>

        <section class="mode-preview mobile-preview" id="mobile-preview" aria-label="スマホ版75画面（基本49＋追加26）"></section>
        <section class="mode-preview pc-preview" id="pc-preview" aria-label="PC版52画面"></section>
      </main>

      <div class="review-toast" id="review-toast" role="status" aria-live="polite"></div>
    </div>

    <script src="./approved-ui.js" defer></script>
  </body>
</html>
